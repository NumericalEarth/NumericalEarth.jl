name: Documentation

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build all examples and deploy the dev documentation"
        type: boolean
        default: false
  schedule:
    # Every other night at 06:00 UTC: the full-examples docs build takes hours
    # on the GPU runner, so building on every push to main both starved the
    # runner and (with cancel-in-progress) never finished. A scheduled build of
    # whatever main is at the time keeps the dev docs at most ~2 days stale.
    # (*/2 runs on odd days of the month, so 31st -> 1st builds back to back —
    # a harmless quirk.)
    - cron: '0 6 */2 * *'
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "examples/**"
      - "ext/**"
      - "src/**"
      - "Project.toml"
  push:
    # Releases deploy the stable/versioned docs immediately; pushes to main no
    # longer trigger builds (see the schedule above).
    tags: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on pull requests, but let scheduled and tag builds
  # queue and run to completion so they can deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JULIA_NUM_PRECOMPILE_TASKS: 8
  JULIA_NUM_THREADS: 8
  JULIA_DEPOT_PATH: "/storage5/github-action-runners/julia-depot"
  NUMERICAL_EARTH_LABEL_BUILD_ALL_EXAMPLES: 'build all examples'
  CDSAPI_URL: "https://cds.climate.copernicus.eu/api"
  CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
  COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
  COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
  ECCO_USERNAME: ${{ secrets.ECCO_USERNAME }}
  ECCO_WEBDAV_PASSWORD: ${{ secrets.ECCO_WEBDAV_PASSWORD }}
  JULIA_CUDA_USE_COMPAT: false

jobs:
  build-docs:
    name: Build documentation
    runs-on: [self-hosted, tartarus, gpu-3]
    timeout-minutes: 1440
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.5'
      - name: Set NUMERICAL_EARTH_BUILD_ALL_EXAMPLES
        shell: bash
        run: |
          if [[ ('${{ github.event_name }}' == 'schedule') || ('${{ github.event_name }}' == 'push' && '${{ github.ref }}' == refs/tags/v*) || ('${{ github.event_name }}' == 'workflow_dispatch' && '${{ inputs.deploy }}' == 'true') || ('${{ github.event_name }}' == 'pull_request' && ${{ contains(github.event.pull_request.labels.*.name, env.NUMERICAL_EARTH_LABEL_BUILD_ALL_EXAMPLES) }} == true) ]]; then
              NUMERICAL_EARTH_BUILD_ALL_EXAMPLES=true
          else
              NUMERICAL_EARTH_BUILD_ALL_EXAMPLES=false
          fi
          echo "NUMERICAL_EARTH_BUILD_ALL_EXAMPLES=${NUMERICAL_EARTH_BUILD_ALL_EXAMPLES}" | tee "${GITHUB_ENV}"
      - name: Instantiate and precompile
        shell: julia --project --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate(verbose=true)
          Pkg.precompile(strict=true)

          using CUDA
          CUDA.precompile_runtime()
      - name: Instantiate docs folder
        run: julia --project=docs --color=yes -e 'using Pkg; Pkg.instantiate(verbose=true)'
      - name: Install Veros in docs CondaPkg environment
        run: |
          julia --project=docs --color=yes -e '
              using NumericalEarth, CondaPkg, PythonCall
              VerosModule = Base.get_extension(NumericalEarth, :NumericalEarthVerosExt)
              VerosModule.install_veros()
          '
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter
          JULIA_SSL_NO_VERIFY: "**"
        run: julia --project=docs --color=yes docs/make.jl
      - uses: actions/upload-artifact@v6
        with:
          name: documentation-build
          path: docs/build
          retention-days: 10

  deploy-docs:
    # We want to deploy docs if:
    # * it's a scheduled build of main (dev docs)
    # * it's a manual dispatch with deploy enabled (dev docs)
    # * on a release (stable/versioned docs)
    # * it's a PR, but not from a fork (preview)
    needs: build-docs
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork) }}
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: [self-hosted, tartarus]
    timeout-minutes: 30
    concurrency:
      group: docs-pushing
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.5'
      - uses: actions/download-artifact@v7
        with:
          name: documentation-build
          path: docs/build
      - name: Remove extra files
        # There may be JLD2 files generated during execution of Literate
        # examples, we don't need them on the website.
        run:
          rm -fv docs/build/literated/*.jld2
      - name: Deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.NUMERICALEARTHDOCUMENTATION_DOCUMENTER_KEY }}
        run: julia --color=yes docs/deploy.jl
