name: CI

# On this branch CI runs one thing: the coupled land-ocean-atmosphere gradient of
# experiments/differentiable_coupled_forecast, on the GPU. The usual CPU, GPU and Reactant test
# jobs are left out so that every run of this workflow is a run of that gradient.

on:
  pull_request:
    paths: &paths
      - ".github/workflows/ci.yml"
      - "experiments/differentiable_coupled_forecast/**"
      - "ext/**"
      - "src/**"
      - "Project.toml"
  push:
    paths: *paths
    branches:
      - dkz/differentiable-coupled-forecast
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: 'eager'

jobs:
  coupled_gradient:
    name: (GPU) - coupled forecast gradient
    runs-on: aws-linux-nvidia-gpu-l4
    container:
      image: ghcr.io/numericalearth/numerical-earth-docker-images:test-julia_1.12.5
      options: --gpus=all
      volumes:
        - /opt:/host-opt
        - /usr/local:/host-usr-local
    timeout-minutes: 180
    env:
      # coupled_model.jl puts Reactant on the GPU when this is set, as the nested gradient test does
      GPU_TEST: "true"
      EXPERIMENT: experiments/differentiable_coupled_forecast
      TMPDIR: /__w/_temp
      JULIA_DEPOT_PATH: '/__w/_temp/depot:/usr/local/share/julia:'
    steps:
      - uses: actions/checkout@v7
      - name: Create workspace temp directories
        run: mkdir -p "${TMPDIR}"
      - name: Configure git safe directory
        run: git config --global --add safe.directory ${PWD}
      - name: Copy LocalPreferences
        # The image's CUDA builds of Reactant_jll and CUDA_Runtime_jll, which the experiment lists in [extras]
        run: cp -v /usr/local/share/julia/environments/numericalearth/LocalPreferences.toml "${EXPERIMENT}/."
      - name: Clean up space on host device
        run: |
          rm -rfv /host-opt/nvidia/ /host-usr-local/cuda*
      - name: Update registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.rm("General")
          Pkg.Registry.add("General")
          Pkg.Registry.update()
      - name: Instantiate the experiment
        timeout-minutes: 45
        run: |
          julia --project="${EXPERIMENT}" --color=yes -e '
              using Pkg
              Pkg.instantiate()
              Pkg.status(["NumericalEarth", "Breeze", "Oceananigans", "Reactant", "Reactant_jll"]; mode = Pkg.PKGMODE_MANIFEST)
          '
      - name: Run the coupled forecast gradient
        timeout-minutes: 150
        # -O1: the traced Julia methods run once to emit the program, so optimizing them at the default
        # -O2 only slows the compile
        shell: bash
        run: |
          mkdir -p mlir_dumps
          julia --project="${EXPERIMENT}" --color=yes --check-bounds=auto -O1 -e '
              # Every module before and after each pass pipeline, to see where a compile stops
              using Reactant
              Reactant.MLIR.IR.DUMP_MLIR_DIR[] = joinpath(pwd(), "mlir_dumps")
              Reactant.MLIR.IR.DUMP_MLIR_ALWAYS[] = true
              include(joinpath(ENV["EXPERIMENT"], "coupled_forecast_gradient.jl"))
          ' &
          julia_pid=$!
          # Every minute, the host memory, Julia's resident memory and the newest dump, so the log shows where
          # the run is when it stalls. Under 2 GiB available it kills Julia, so the step fails and the dumps
          # upload, instead of the host starving the runner (which loses the job and everything in it)
          (
            while kill -0 ${julia_pid} 2> /dev/null; do
              sleep 60
              avail=$(awk '/MemAvailable/ {print int($2 / 1024)}' /proc/meminfo)
              rss=$(awk '/VmRSS/ {print int($2 / 1024)}' /proc/${julia_pid}/status 2> /dev/null)
              newest=$(ls -t mlir_dumps | head -1)
              echo "[monitor $(date -u +%H:%M:%S)] ${avail} MiB available, Julia at ${rss:-?} MiB;" \
                   "$(ls mlir_dumps | wc -l) dumps ($(du -sh mlir_dumps | cut -f1)), newest ${newest:-none}"
              if [ "${avail}" -lt 2048 ]; then
                echo "[monitor] under 2 GiB available: killing Julia"
                kill -9 ${julia_pid}
              fi
            done
          ) &
          wait ${julia_pid}
      - name: Upload the sensitivity maps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coupled-forecast-sensitivity
          path: coupled_forecast_sensitivity.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the MLIR dumps
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coupled-gradient-mlir-dumps
          path: mlir_dumps
          if-no-files-found: ignore
          retention-days: 7
