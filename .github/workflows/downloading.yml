name: Dataset status dashboard

# Renders the `dataset-status-*` artifacts the two data workflows upload into the dashboard at
# https://numericalearth.github.io/NumericalEarth.jl/. `main` publishes to the root, everything
# else to a preview directory.

on:
  workflow_run:
    workflows: ["CDS Downloading", "Data tests"]
    types: [completed]

# Both data workflows push to gh-pages; a cancelled run would lose records the survivor lacks.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read     # download artifacts from the run that triggered this one
  contents: write   # publish_dataset_status.sh pushes the dashboard to gh-pages

jobs:
  publish:
    name: Publish dataset status dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"
      - name: Collect dataset status records
        continue-on-error: true   # an unmatched pattern is an error, and a run can upload nothing
        uses: actions/download-artifact@v4
        with:
          pattern: dataset-status-*
          path: dataset-status
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for records
        id: records
        run: |
          if [ -n "$(find dataset-status -type f -print -quit 2>/dev/null)" ]; then
              echo "found=true" | tee -a "${GITHUB_OUTPUT}"
          else
              echo "found=false" | tee -a "${GITHUB_OUTPUT}"
              echo "No dataset status records in run ${{ github.event.workflow_run.id }}." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Render dashboard
        if: steps.records.outputs.found == 'true'
        run: julia --color=yes .github/scripts/build_dataset_status.jl dataset-status site
      - name: Determine publication target
        id: target
        if: steps.records.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "${PR_NUMBER}" ]; then
              destination="previews/PR${PR_NUMBER}"
          elif [ "${HEAD_BRANCH}" = "main" ]; then
              destination="."
          else
              destination="previews/${HEAD_BRANCH//\//-}"
          fi
          echo "destination=${destination}" | tee -a "${GITHUB_OUTPUT}"
      - name: Publish to gh-pages
        if: steps.records.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish_dataset_status.sh site "${{ steps.target.outputs.destination }}"
      - name: Summarize
        if: steps.records.outputs.found == 'true'
        run: |
          destination="${{ steps.target.outputs.destination }}"
          if [ "${destination}" = "." ]; then
              url="https://numericalearth.github.io/NumericalEarth.jl/"
          else
              url="https://numericalearth.github.io/NumericalEarth.jl/${destination}/"
          fi
          echo "Dataset status dashboard: ${url}" >> "${GITHUB_STEP_SUMMARY}"
